<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#660000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#FFD700" stroke-width="3"/>
  <!-- Medical Cross -->
  <rect x="35" y="20" width="30" height="60" rx="3" fill="#ffffff"/>
  <rect x="20" y="35" width="60" height="30" rx="3" fill="#ffffff"/>
  <!-- Center Highlight -->
  <circle cx="50" cy="50" r="12" fill="#FFD700"/>
  <!-- Letters A R -->
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B0000" text-anchor="middle">AR</text>
</svg>